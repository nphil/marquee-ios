name: Marquee

options:
  bundleIdPrefix: com.nphil
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Defaults for local builds; CI passes the release version as overrides.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0.1.0"

packages:
  MarqueeCore:
    path: Packages/MarqueeCore
  MarqueeLive:
    path: Packages/MarqueeLive
  VideoEngine:
    url: https://github.com/nphil/stashy-videoengine.git
    exactVersion: 2.0.3
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk.git
    exactVersion: 4.8.6
  LumaRemoteKit:
    url: https://github.com/nphil/LumaRemoteKit
    from: 1.0.3

targets:
  Marquee:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Resources
        excludes:
          # Published for the Feather feed; the app gets its icon from the asset catalog.
          - AppIcon-1024.png
          - Licences
      # A folder reference keeps the licence tree intact; several files share the name COPYING.
      - path: Resources/Licences
        type: folder
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: MarqueeCore
      - package: MarqueeLive
        product: MarqueeLive
      # Debug builds play its synthetic tuner in UI tests (App/Testing/FakeTuner.swift).
      - package: MarqueeLive
        product: LiveFixtures
      - package: VideoEngine
        product: VideoEngine
      - package: GoogleCast
        product: GoogleCastDynamic
      - package: LumaRemoteKit
        product: LumaRemoteKit
      - package: LumaRemoteKit
        product: LumaRemoteCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Marquee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Lifts the iPhone's 60 fps cap on Core Animation so animations reach 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Marquee looks for Plex servers and LumaTV on the local network, plays from the servers and works as the TV's remote, and finds Chromecasts there while its Chromecast plugin is on.
        NSBonjourServices:
          - _plex._tcp
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
          - _lumatv-remote._tcp
        NSCameraUsageDescription: Marquee scans the code a LumaTV shows to pair the remote with it.
        CFBundleURLTypes:
          # The link in a LumaTV's pairing QR code.
          - CFBundleURLName: com.nphil.marquee.lumaremote
            CFBundleURLSchemes:
              - lumaremote
        UIAppFonts:
          - Manrope.ttf
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-Italic.ttf
          - AtkinsonHyperlegible-BoldItalic.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nphil.marquee
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MarqueeUITests

  MarqueeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - FakePlex
      # A folder reference keeps the fixture tree intact in the test bundle; the app reads it from there.
      - path: UITests/FakePlex
        type: folder
        buildPhase: resources
    dependencies:
      - target: Marquee
      # The UI tests serve a fake LumaTV from the test runner for the remote to pair with.
      - package: LumaRemoteKit
        product: LumaRemoteFakeTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nphil.marquee.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Marquee
        TARGETED_DEVICE_FAMILY: "1"
