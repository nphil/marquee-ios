name: iOS

on:
  push:
  workflow_dispatch:

# One queue per ref: a second push waits for the first run instead of racing it, so two runs on
# main never claim the same version.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned: the image also carries a 27.2 release candidate, which a newest-first pick would choose.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  core:
    name: Core
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Theme contrast and distinctness
        run: python3 -B tools/check_themes.py Resources/themes.json

      - name: MarqueeCore tests
        run: swift test --package-path Packages/MarqueeCore

  live:
    name: Live engine
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Packages/MarqueeLive
    steps:
      - uses: actions/checkout@v5

      # The engine's FFmpeg has iOS slices only, so the package tests run on a simulator. Tests
      # launched right after the simulator booted stalled for 5-40 s on this runner image
      # (VideoEngine, 2026-11); booting first lets the boot overlap resolution and the build,
      # and the tests start at least two minutes after it.
      - name: Boot simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if runtime.endswith("iOS-27-0"):
                  for device in devices:
                      if device["name"] == "iPhone 18 Pro":
                          print(device["udid"])
                          raise SystemExit
          raise SystemExit("No iPhone 18 Pro simulator on iOS 27.0")
          ')
          xcrun simctl boot "$UDID"
          date +%s > "$RUNNER_TEMP/booted-at"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Listing the schemes resolves the package graph, so it shares the retry with resolution. Xcode
      # names the scheme that builds every target after the package, or <package>-Package.
      - name: Resolve Swift packages
        id: scheme
        run: |
          for attempt in 1 2 3; do
            if SCHEMES=$(xcodebuild -list -json) \
               && SCHEME=$(echo "$SCHEMES" | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          schemes = (info.get("workspace") or info.get("project") or {}).get("schemes", [])
          print(next(name for name in ("MarqueeLive-Package", "MarqueeLive") if name in schemes))
          ') \
               && xcodebuild -resolvePackageDependencies -scheme "$SCHEME"; then
              echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Package resolution failed (attempt $attempt of 3)."
            sleep $((attempt * 20))
          done
          exit 1

      - name: MarqueeLive tests
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          SCHEME: ${{ steps.scheme.outputs.scheme }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing -scheme "$SCHEME" -destination "id=$UDID" 2>&1 | xcbeautify
          xcrun simctl bootstatus "$UDID" -b
          SETTLE=$(( $(cat "$RUNNER_TEMP/booted-at") + 120 - $(date +%s) ))
          if [ "$SETTLE" -gt 0 ]; then sleep "$SETTLE"; fi
          # Naming each test target fails the run if the scheme leaves one out. A failed test runs once
          # more, as in the App job: the simulator's stalls also hit real-time playback deadlines here.
          xcodebuild test-without-building -scheme "$SCHEME" -destination "id=$UDID" \
            -retry-tests-on-failure -test-iterations 2 \
            -only-testing:LiveEngineTests -only-testing:MarqueeLiveTests 2>&1 | xcbeautify

  app:
    name: App
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          # Release tags are the record of what shipped: the next version is the newest tag's patch
          # plus one. The version only reaches the build as overrides, so nothing is committed back.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION=0.1.0
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # The video engine brings six FFmpeg xcframework zips from a GitHub release, and that download
      # times out often enough (Stashy, 2026-08-10: all six at once) that one failure is retried
      # before the run counts as red. Every later xcodebuild reads the same checkout.
      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                 -project Marquee.xcodeproj \
                 -scheme Marquee \
                 -clonedSourcePackagesDirPath build/SourcePackages; then
              exit 0
            fi
            echo "Package resolution failed (attempt $attempt of 3)."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build for iPhone (unsigned)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          xcodebuild build \
            -project Marquee.xcodeproj \
            -scheme Marquee \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | xcbeautify
          STATUS=${PIPESTATUS[0]}
          set -e
          # Compiler diagnostics have the exact form "<path>:<line>:<col>: error: <msg>"; each one is
          # also annotated on its file and line.
          if grep -qE ':[0-9]+:[0-9]+: error: ' xcodebuild.log; then
            grep -E ':[0-9]+:[0-9]+: error: ' xcodebuild.log | sort -u
            grep -E '\.swift:[0-9]+:[0-9]+: error: ' xcodebuild.log | sort -u \
              | sed -E "s#^${GITHUB_WORKSPACE}/##" \
              | sed -E 's#^(.+):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#'
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            grep -E 'error:|BUILD FAILED' xcodebuild.log | sort -u | head -40
            exit "$STATUS"
          fi

      - name: Package IPA
        run: |
          APP=build/DD/Build/Products/Release-iphoneos/Marquee.app
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          if [ ! -s "$APP/$EXE" ]; then
            echo "::error::The app has no executable '$EXE': the build did not finish."
            exit 1
          fi
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Marquee.ipa Payload
          BYTES=$(wc -c < Marquee.ipa | tr -d ' ')
          echo "Executable: $(wc -c < "$APP/$EXE" | tr -d ' ') bytes. IPA: $BYTES bytes."
          # The engine's FFmpeg is most of the IPA (12.5 MB in v0.1.7, executable 31.4 MB); one under
          # 6 MB has lost it.
          if [ "$BYTES" -lt 6000000 ]; then
            echo "::error::Marquee.ipa is only $BYTES bytes."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Marquee-ipa
          path: Marquee.ipa
          if-no-files-found: error

  # The UI tests are split across a matrix of runners, one simulator each. A runner has 3 cores and 7 GB;
  # a second simulator on it doubled every test's time and hit the 15 s waits (measured 2026-11-09), and
  # the runner pool holds 4 jobs at once (Core, App and Live take three of them for the first minutes), so
  # a fifth shard waits for a whole shard to end. The serial run took
  # 58 min plus 17 min for the accessibility pass. tools/ui-shards.py reads the tests from UITests/ and
  # balances them, so a new test joins a shard on its own. A shard runs its accessibility tests after
  # its standard ones.
  plan:
    name: Plan UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The Increase Contrast and accessibility text pass is skipped on a branch whose change leaves the
      # app, its tests, its resources and the CI itself alone; main always runs it, so no release ships
      # without it. If the comparison with main fails, the pass runs.
      - name: Shard the tests
        id: plan
        run: |
          FLAGS=""
          if [ "$GITHUB_REF" != refs/heads/main ] \
             && git diff --quiet origin/main...HEAD -- App UITests Resources Packages project.yml tools .github; then
            FLAGS="--no-accessibility"
            echo "No app, test or CI files changed: the accessibility pass is skipped."
          fi
          echo "matrix=$(python3 tools/ui-shards.py 4 $FLAGS)" >> "$GITHUB_OUTPUT"

  ui:
    name: UI tests ${{ matrix.shard }}
    needs: plan
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      STANDARD: ${{ matrix.standard }}
      ACCESSIBILITY: ${{ matrix.accessibility }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate project
        run: |
          # Homebrew's own update and cleanup are skipped: with a simulator booting, this step took 3-6 min.
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                 -project Marquee.xcodeproj \
                 -scheme Marquee \
                 -clonedSourcePackagesDirPath build/SourcePackages; then
              exit 0
            fi
            echo "Package resolution failed (attempt $attempt of 3)."
            sleep $((attempt * 20))
          done
          exit 1

      # The first boot takes minutes; started now, it finishes while the project builds.
      - name: Boot iPhone 18 Pro simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if runtime.endswith("iOS-27-0"):
                  for device in devices:
                      if device["name"] == "iPhone 18 Pro":
                          print(device["udid"])
                          raise SystemExit
          raise SystemExit("No iPhone 18 Pro simulator on iOS 27.0")
          ')
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Marquee.xcodeproj \
            -scheme Marquee \
            -destination "id=$UDID" \
            -derivedDataPath build/DD-sim \
            -clonedSourcePackagesDirPath build/SourcePackages \
            2>&1 | tee xcodebuild-build.log | xcbeautify

      # A failed test runs once more: the xcode-27 preview simulator sometimes stalls UI queries or app
      # launch for 30+ s under load (2026-11-07: testProfiles launch timeout, testProfilesDawn query
      # timeout), which red-flagged releases whose code passed elsewhere. A real failure fails twice.
      - name: UI tests and screenshots
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p screens
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3

          FAILED=0
          run_pass() {
            NAME=$1
            TESTS=$2
            if [ -z "$TESTS" ]; then return 0; fi
            FLAGS=()
            for TEST in $TESTS; do FLAGS+=("-only-testing:MarqueeUITests/$TEST"); done
            set +e
            TEST_RUNNER_SCREENS_DIR="$PWD/screens" xcodebuild test-without-building \
              -project Marquee.xcodeproj \
              -scheme Marquee \
              -destination "id=$UDID" \
              -derivedDataPath build/DD-sim \
              -clonedSourcePackagesDirPath build/SourcePackages \
              -resultBundlePath "build/UITests-$NAME.xcresult" \
              -retry-tests-on-failure -test-iterations 2 \
              "${FLAGS[@]}" \
              2>&1 | tee "xcodebuild-test-$NAME.log" | xcbeautify
            STATUS=${PIPESTATUS[0]}
            set -e
            if grep -qE ':[0-9]+:[0-9]+: error: ' "xcodebuild-test-$NAME.log"; then
              grep -E ':[0-9]+:[0-9]+: error: ' "xcodebuild-test-$NAME.log" | sort -u
              grep -E '\.swift:[0-9]+:[0-9]+: error: ' "xcodebuild-test-$NAME.log" | sort -u \
                | sed -E "s#^${GITHUB_WORKSPACE}/##" \
                | sed -E 's#^(.+):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3::\4#'
            fi
            if [ "$STATUS" -ne 0 ]; then FAILED=1; fi
          }

          run_pass standard "$STANDARD"
          if [ -n "$ACCESSIBILITY" ]; then
            xcrun simctl ui "$UDID" increase_contrast enabled
            xcrun simctl ui "$UDID" content_size accessibility-large
          fi
          run_pass accessibility "$ACCESSIBILITY"
          exit "$FAILED"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-${{ matrix.shard }}
          path: screens/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: UITests-xcresult-${{ matrix.shard }}
          path: build/UITests*.xcresult
          if-no-files-found: ignore

  # The route menu and the A–Z rail mid-scrub on the smallest and the largest iPhone simulator the image
  # has: the menu's rows must stay inside the screen, upright and on its side, and scroll when they do not
  # fit; the rail's lens and callout are shot for review. The standard shards run the same tests on the
  # iPhone 18 Pro.
  ui-sizes:
    name: UI tests on the smallest and largest iPhone
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Generate project
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          xcodegen generate

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                 -project Marquee.xcodeproj \
                 -scheme Marquee \
                 -clonedSourcePackagesDirPath build/SourcePackages; then
              exit 0
            fi
            echo "Package resolution failed (attempt $attempt of 3)."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Pick and boot the simulators
        id: simulators
        run: |
          python3 tools/size-simulators.py > udids.txt
          echo "small=$(sed -n 1p udids.txt)" >> "$GITHUB_OUTPUT"
          echo "large=$(sed -n 2p udids.txt)" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$(sed -n 1p udids.txt)"

      - name: Build for testing
        env:
          SMALL: ${{ steps.simulators.outputs.small }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Marquee.xcodeproj \
            -scheme Marquee \
            -destination "id=$SMALL" \
            -derivedDataPath build/DD-sim \
            -clonedSourcePackagesDirPath build/SourcePackages \
            2>&1 | tee xcodebuild-build.log | xcbeautify

      # One simulator at a time: two on a runner double every test's time. A failed test runs once more.
      - name: Route menu and A–Z rail screenshots
        env:
          SMALL: ${{ steps.simulators.outputs.small }}
          LARGE: ${{ steps.simulators.outputs.large }}
        run: |
          mkdir -p screens
          FAILED=0
          for UDID in "$SMALL" "$LARGE"; do
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl ui "$UDID" appearance light
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
            set +e
            TEST_RUNNER_SCREENS_DIR="$PWD/screens" xcodebuild test-without-building \
              -project Marquee.xcodeproj \
              -scheme Marquee \
              -destination "id=$UDID" \
              -derivedDataPath build/DD-sim \
              -clonedSourcePackagesDirPath build/SourcePackages \
              -resultBundlePath "build/UITests-$UDID.xcresult" \
              -retry-tests-on-failure -test-iterations 2 \
              -only-testing:MarqueeUITests/PlayerRouteMenuScreenshots \
              -only-testing:MarqueeUITests/HeaderScreenshotTests/testAlphabetRailRosePine \
              -only-testing:MarqueeUITests/HeaderScreenshotTests/testAlphabetRailDawn \
              2>&1 | tee "xcodebuild-test-$UDID.log" | xcbeautify
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then FAILED=1; fi
            set -e
            xcrun simctl shutdown "$UDID"
          done
          exit "$FAILED"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-sizes
          path: screens/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: UITests-xcresult-sizes
          path: build/UITests*.xcresult
          if-no-files-found: ignore

  # One `screens` artifact with every screenshot, as when a single job took them all.
  screens:
    name: Screenshots
    needs: [ui, ui-sizes]
    if: always() && needs.ui.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: screens
          pattern: screens-*
          delete-merged: true
          if-no-files-found: warn

  release:
    name: Release
    needs: [core, live, app, ui, ui-sizes]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.app.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: Marquee-ipa
          path: dist

      - name: Publish release
        run: |
          gh release create "v$VERSION" dist/Marquee.ipa \
            --target "$GITHUB_SHA" \
            --title "Marquee $VERSION" \
            --notes "Unsigned IPA for Feather or AltStore, built from ${GITHUB_SHA::7}."

      # Feather reads the source from apps.json on main through raw.githubusercontent.com, as Stashy
      # does. A release-asset URL redirects to an expiring signed link served as an octet-stream
      # attachment, which Feather failed to add (2026-11-06). The entry is patched onto main as it is
      # now rather than rebased, because two runs inserting at the head of `versions` conflict
      # (Stashy, 2026-08-10).
      - name: Update feed on main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B feed-update origin/main
          python3 - <<'PY'
          import datetime, json, os, pathlib, plistlib, zipfile

          version = os.environ["VERSION"]
          repo = os.environ["GH_REPO"]
          with zipfile.ZipFile("dist/Marquee.ipa") as ipa:
              info = plistlib.loads(ipa.read("Payload/Marquee.app/Info.plist"))

          # Everything but the version history is rewritten each release, so the listing follows
          # this workflow and the built app rather than whatever the first release wrote.
          feed = pathlib.Path("apps.json")
          versions = json.loads(feed.read_text())["apps"][0]["versions"] if feed.exists() else []
          entry = {
              "version": version,
              "buildVersion": info["CFBundleVersion"],
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "localizedDescription": f"Unsigned IPA, built from {os.environ['GITHUB_SHA'][:7]}.",
              "downloadURL": f"https://github.com/{repo}/releases/download/v{version}/Marquee.ipa",
              "size": os.path.getsize("dist/Marquee.ipa"),
              "minOSVersion": info["MinimumOSVersion"],
          }
          icon = f"https://raw.githubusercontent.com/{repo}/main/Resources/AppIcon-1024.png"
          source = {
              "name": "Marquee",
              "subtitle": "Plex for iPhone",
              "description": "Feather and AltStore source for Marquee, a native Plex client for iPhone.",
              "iconURL": icon,
              "website": f"https://github.com/{repo}",
              "tintColor": "#A79BF5",
              "apps": [{
                  "name": "Marquee",
                  "bundleIdentifier": info["CFBundleIdentifier"],
                  "developerName": "Nitin",
                  "subtitle": "Plex for iPhone",
                  "localizedDescription": "A native Plex client for iPhone, in 40 colour themes.",
                  "iconURL": icon,
                  "tintColor": "#A79BF5",
                  "category": "entertainment",
                  "deviceFamilies": [1],
                  "appPermissions": {
                      "entitlements": [],
                      "privacy": {key: value for key, value in info.items() if key.endswith("UsageDescription")},
                  },
                  "versions": [entry] + [v for v in versions if v["version"] != version],
              }],
          }
          feed.write_text(json.dumps(source, indent=2) + "\n")
          PY
          git add apps.json
          git commit -m "Update the Feather source for v$VERSION [skip ci]"
          git push origin HEAD:main
