name: iOS
on: push
permissions:
  contents: read
jobs:
  discovery-report:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Run the pre-library report on iPhone simulator
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          mkdir -p screens
          TEST_RUNNER_SCREENS_DIR="$PWD/screens" xcodebuild test \
            -project Marquee.xcodeproj -scheme Marquee \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -parallel-testing-enabled NO -resultBundlePath report.xcresult \
            -only-testing:MarqueeUITests/DiagnosticsScreenshotTests/testSendDiscoveryLogBeforeChoosingAServer \
            2>&1 | tee simulator.log | xcbeautify
          grep -E 'Test Case .*testSendDiscoveryLogBeforeChoosingAServer.*passed' simulator.log
          test -s screens/servers-empty-send-logs.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: discovery-report-evidence
          path: |
            screens/
            simulator.log
            report.xcresult/
