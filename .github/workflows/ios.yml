name: iOS
on: push
permissions:
  contents: read
jobs:
  backup-review:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Verify the exported backup opens for review
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          mkdir -p screens
          TEST_RUNNER_SCREENS_DIR="$PWD/screens" xcodebuild test \
            -project Marquee.xcodeproj -scheme Marquee \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -parallel-testing-enabled NO -resultBundlePath backup.xcresult \
            -only-testing:MarqueeUITests/BackupPickerTests/testExportedBackupOpensForReviewWithoutApplyingIt \
            2>&1 | tee simulator.log | xcbeautify
          grep -E 'Test Case .*testExportedBackupOpensForReviewWithoutApplyingIt.*passed' simulator.log
          test -s screens/backup-picked-for-review.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backup-review-evidence
          path: |
            screens/
            simulator.log
            backup.xcresult/
